name: Release desktop

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Must match the VERSION file, for example v1.6.0
        required: true
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  SIFLUX_UPDATER_FEED_URL: https://github.com/Aa1689756333/SiFlux-Studio/releases/latest/download/desktop-update.json
  UPDATER_DOWNLOAD_BASE: https://github.com/Aa1689756333/SiFlux-Studio/releases/download

jobs:
  preflight:
    name: Validate and open draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Require official main
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Desktop updater releases can only be dispatched from main. Current ref: ${{ github.ref }}"
            exit 1
          fi
          if [[ "${{ github.repository }}" != "Aa1689756333/SiFlux-Studio" ]]; then
            echo "This workflow publishes production updater assets for Aa1689756333/SiFlux-Studio only."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Require two rounds of real client generation
        run: node scripts/verify-real-generation-release.mjs

      - name: Require updater keys
        env:
          SIFLUX_UPDATER_PRIVATE_KEY: ${{ secrets.SIFLUX_UPDATER_PRIVATE_KEY }}
          SIFLUX_UPDATER_PUBLIC_KEY: ${{ vars.SIFLUX_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SIFLUX_UPDATER_PRIVATE_KEY:-}" ]]; then
            echo "Missing GitHub Actions secret SIFLUX_UPDATER_PRIVATE_KEY."
            echo "It must be standard base64 of a 64-byte Ed25519 private key."
            echo "Generate a keypair locally with:"
            echo "  cd backend && go run ./cmd/update-release gen-key --private-key /path/to/beeftv-updater.private --public-key /path/to/beeftv-updater.public"
            echo "Put the private file contents in the repository secret. Do not commit that file."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi
          if [[ -z "${SIFLUX_UPDATER_PUBLIC_KEY:-}" ]]; then
            echo "Missing GitHub Actions variable SIFLUX_UPDATER_PUBLIC_KEY."
            echo "It must be standard base64 of the matching 32-byte Ed25519 public key."
            echo "Unsigned automatic updates are not published."
            exit 1
          fi

      - name: Validate version, changelog, keys, and uniqueness
        id: meta
        env:
          SIFLUX_UPDATER_PRIVATE_KEY: ${{ secrets.SIFLUX_UPDATER_PRIVATE_KEY }}
          SIFLUX_UPDATER_PUBLIC_KEY: ${{ vars.SIFLUX_UPDATER_PUBLIC_KEY }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        working-directory: backend
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ../VERSION)"
          commit="$(git -C .. rev-parse HEAD)"
          go test ./cmd/update-release

          greater_args=()
          latest=""
          release_tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if go run ./cmd/update-release validate-version --version "$tag" >/dev/null 2>&1; then
              if [[ -z "$latest" ]] || go run ./cmd/update-release validate-version --version "$tag" --greater-than "$latest" >/dev/null 2>&1; then
                latest="$tag"
              fi
            fi
          done <<< "$release_tags"
          if [[ -n "$latest" ]]; then
            greater_args+=(--greater-than "$latest")
          fi
          go run ./cmd/update-release validate-version \
            --version "$version" \
            --confirm "$CONFIRM_VERSION" \
            "${greater_args[@]}"

          go run ./cmd/update-release changelog --file ../CHANGELOG.md --version "$version" > "$RUNNER_TEMP/release-notes.md"
          go run ./cmd/update-release print-ldflags >/dev/null

          derived="$(go run ./cmd/update-release public-key | tr -d '\r\n')"
          expected="$(printf '%s' "$SIFLUX_UPDATER_PUBLIC_KEY" | tr -d '\r\n')"
          if [[ "$derived" != "$expected" ]]; then
            echo "Private key does not derive GitHub variable SIFLUX_UPDATER_PUBLIC_KEY."
            echo "Release binaries and the signed feed must use the same public key."
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "GitHub release $version already exists. Updater version assets are immutable and cannot be overwritten."
            echo "If a failed draft was never published, delete it and its tag only after confirming it was never public."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Git tag $version already exists. Choose a new VERSION; published tags are not reused."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Prepare release gate dependencies
        run: |
          sh plugin-packages/build-packages.sh
          cd web
          bun install --frozen-lockfile

      - name: Local release contract gate
        run: ./scripts/verify-beeftv-local-release.sh

      - name: Create draft GitHub release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --draft \
            --title "SiFlux $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "${{ github.sha }}"

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            wails_platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin-amd64
            wails_platform: darwin/amd64
          - os: windows-2022
            platform: windows-amd64
            wails_platform: windows/amd64
          - os: ubuntu-24.04
            platform: linux-amd64
            wails_platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Select bundled Node runtime
        shell: bash
        run: |
          node -e 'const fs=require("fs"),p=require("path"); const bin=p.dirname(process.execPath); fs.appendFileSync(process.env.GITHUB_ENV, `SIFLUX_NODE_RUNTIME=${process.platform==="win32"?bin:p.dirname(bin)}\n`);'

      - name: Verify agent host packaging contract
        shell: bash
        run: bun test scripts/package-agent-host.test.mjs

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ffmpeg fonts-noto-cjk xvfb xdotool dbus-x11

      - name: Install MSYS2 UCRT64 GCC
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Assert DWARF 5 CGO compiler
        if: runner.os == 'Windows'
        env:
          MSYSTEM_PREFIX: ${{ steps.msys2.outputs.msys2-location }}\ucrt64
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\assert-windows-dwarf5-cgo.ps1

      - name: Build official plugin packages
        if: runner.os != 'Windows'
        run: sh plugin-packages/build-packages.sh

      - name: Build macOS or Linux desktop
        if: runner.os != 'Windows'
        env:
          SIFLUX_SKIP_LOCAL_VERIFY: "1"
          SIFLUX_WAILS_PLATFORM: ${{ matrix.wails_platform }}
          SIFLUX_UPDATER_PUBLIC_KEY: ${{ vars.SIFLUX_UPDATER_PUBLIC_KEY }}
        run: ./scripts/build-siflux-release.sh

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        env:
          SIFLUX_UPDATER_PUBLIC_KEY: ${{ vars.SIFLUX_UPDATER_PUBLIC_KEY }}
          CGO_ENABLED: "1"
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-siflux-windows-release.ps1

      - name: Verify Windows video disconnect recovery
        if: runner.os == 'Windows'
        working-directory: backend
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          go test ./internal/app -run 'TestWindowsVideoConnectionResetRecovery|TestVideoRecoverySocketResetNeverResubmits|TestVideoRecoveryLostReceiptNeverResubmits|TestVideoRecoveryBeefAPIQueryUsesOnlyGet' -count=1 -timeout=120s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package updater zip
        working-directory: backend
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          input="cmd/desktop/build/bin"
          if [[ "$PLATFORM" == darwin-* ]]; then
            input="$input/BeefTV.app"
          elif [[ "$PLATFORM" == linux-amd64 ]]; then
            input="$input/SiFlux-linux"
          fi
          go run ./cmd/update-release package \
            --platform "$PLATFORM" \
            --input "$input" \
            --output "../dist/SiFlux-${VERSION}-${PLATFORM}.zip"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis --no-progress -y; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Package native installer
        shell: bash
        run: python scripts/package-desktop-installer.py --platform '${{ matrix.platform }}'

      - name: Verify native installer lifecycle
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          payload='backend/cmd/desktop/build/bin'
          suffix='-setup.exe'
          if [[ "$PLATFORM" == darwin-* ]]; then payload="$payload/BeefTV.app"; suffix='.dmg'; fi
          if [[ "$PLATFORM" == linux-* ]]; then payload="$payload/SiFlux-linux"; suffix='.deb'; fi
          command=(python scripts/smoke-desktop-installer.py --platform "$PLATFORM" --installer "dist/SiFlux-${VERSION}-${PLATFORM}${suffix}" --payload "$payload")
          if [[ "$PLATFORM" == linux-* ]]; then xvfb-run -a dbus-run-session -- "${command[@]}"; else "${command[@]}"; fi

      - name: Verify MCP from final packaged CLI
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/smoke-packaged-cli_test.py
          python scripts/smoke-packaged-cli.py --archive "dist/SiFlux-${VERSION}-${PLATFORM}.zip" --platform "$PLATFORM"

      - name: Verify upgrades from released Windows clients
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test-windows-published-upgrade.py --archive "dist/SiFlux-${{ needs.preflight.outputs.version }}-windows-amd64.zip" --version "${{ needs.preflight.outputs.version }}" --output dist/windows-upgrade-evidence.json

      - name: Verify Linux desktop window from final archive
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 scripts/smoke-linux-desktop.py --archive "dist/SiFlux-${{ needs.preflight.outputs.version }}-linux-amd64.zip"

      - name: Preserve Windows upgrade acceptance
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-evidence
          path: dist/windows-upgrade-evidence.json

      - name: Store platform zip for publication
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/SiFlux-${{ needs.preflight.outputs.version }}-${{ matrix.platform }}*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign feed and publish
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      SIFLUX_UPDATER_PRIVATE_KEY: ${{ secrets.SIFLUX_UPDATER_PRIVATE_KEY }}
      SIFLUX_UPDATER_PUBLIC_KEY: ${{ vars.SIFLUX_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Retrieve completed platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Check complete platform set
        run: |
          set -euo pipefail
          mapfile -t zips < <(find dist -maxdepth 1 -name "SiFlux-${VERSION}-*.zip" | LC_ALL=C sort)
          if [[ "${#zips[@]}" -ne 4 ]]; then
            echo "Expected 4 platform zips on draft $VERSION before signing desktop-update.json, found ${#zips[@]}."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          for name in "darwin-arm64.dmg" "darwin-amd64.dmg" "windows-amd64-setup.exe" "linux-amd64.deb"; do
            test -s "dist/SiFlux-${VERSION}-${name}"
          done

      - name: Sign and verify desktop-update.json
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/update-release sign \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --changelog ../CHANGELOG.md \
            --download-base "$UPDATER_DOWNLOAD_BASE" \
            --expect-public-key "$SIFLUX_UPDATER_PUBLIC_KEY" \
            --require-platforms darwin-arm64,darwin-amd64,windows-amd64,linux-amd64 \
            --asset "darwin-arm64=../dist/SiFlux-${VERSION}-darwin-arm64.zip" \
            --asset "darwin-amd64=../dist/SiFlux-${VERSION}-darwin-amd64.zip" \
            --asset "windows-amd64=../dist/SiFlux-${VERSION}-windows-amd64.zip" \
            --asset "linux-amd64=../dist/SiFlux-${VERSION}-linux-amd64.zip" \
            --output "../dist/desktop-update.json"
          go run ./cmd/update-release verify \
            --envelope "../dist/desktop-update.json" \
            --public-key-text "$SIFLUX_UPDATER_PUBLIC_KEY"

      - name: Publish signed GitHub release
        run: |
          set -euo pipefail
          gh release upload "$VERSION" "dist/desktop-update.json" dist/SiFlux-"$VERSION"-*.zip dist/SiFlux-"$VERSION"-*.dmg dist/SiFlux-"$VERSION"-*-setup.exe dist/SiFlux-"$VERSION"-*.deb
          gh release edit "$VERSION" --draft=false --latest

      - name: Report published feed
        run: echo "Published $VERSION at $SIFLUX_UPDATER_FEED_URL."
